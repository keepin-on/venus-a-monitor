<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Venus A Monitor</title>
  <style>
    :root { --bg:#0b0e14; --card:#131923; --border:#222c3a; --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --green:#3fb950; --orange:#d29922; }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family: system-ui, -apple-system, sans-serif;
      background:var(--bg);
      color:var(--text);
      padding: calc(env(safe-area-inset-top, 28px) + 18px) 14px 18px 14px;
    }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
    .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:700; background:#1f2937; }
    .badge.charge { background:rgba(63,185,80,.18); color:var(--green); }
    .badge.discharge { background:rgba(210,153,34,.18); color:var(--orange); }
    .grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; }
    .wide { grid-column: span 2; }
    .label { font-size:12px; color:var(--muted); margin-bottom:4px; }
    .val { font-size:26px; font-weight:700; letter-spacing:-0.02em; }
    .sub { font-size:12px; color:#9da7b3; margin-top:4px; line-height:1.4; }
    .day-row { display:flex; justify-content:space-between; gap:10px; margin-top:8px; font-size:13px; flex-wrap:wrap; }
    .day-ch { color:var(--green); font-weight:700; }
    .day-dis { color:var(--orange); font-weight:700; }
    button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:9px 14px; font-weight:600; font-size:13px; cursor:pointer; }
    canvas { width:100%; height:200px; background:#0e131b; border-radius:10px; display:block; margin-top:8px; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <div style="font-size:17px;font-weight:700;">Marstek Venus A</div>
      <div class="sub" id="updated">Ожидание опроса...</div>
    </div>
    <button onclick="pollNow()">Обновить</button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Заряд батареи</div>
      <div class="val" id="soc">—%</div>
      <div class="sub" id="cap">— / — Вт·ч</div>
    </div>
    <div class="card">
      <div class="label">В моменте / Статус</div>
      <div class="val" id="moment">— Вт</div>
      <div class="sub"><span id="statusBadge" class="badge">—</span></div>
    </div>
    <div class="card wide">
      <div class="label">Прогноз от моментальной мощности</div>
      <div class="val" id="eta">—</div>
      <div class="sub" id="etaSub">Ожидание данных...</div>
    </div>
    <div class="card wide">
      <div class="label">Суточный график заряда (%) и суммарный поток за сутки</div>
      <div class="day-row">
        <span class="day-ch" id="dayCharged">Заряжено за сутки: — Вт·ч</span>
        <span class="day-dis" id="dayDischarged">Высажено за сутки: — Вт·ч</span>
      </div>
      <canvas id="chart" width="600" height="220"></canvas>
    </div>
  </div>

  <script>
    const STATION_IP = "192.168.0.128";
    const PORT = 30000;
    const POLL_MS = 5000;
    const RESERVE_PCT = 12;
    const EFFICIENCY = 0.90;
    const STORAGE_HIST = "venus_hist_v2";
    let lastDiag = "Ожидание опроса...";

    function loadHistory() {
      try {
        const arr = JSON.parse(localStorage.getItem(STORAGE_HIST) || "[]");
        const cutoff = Date.now() / 1000 - 24 * 3600;
        return Array.isArray(arr) ? arr.filter(x => (x.ts || 0) >= cutoff) : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(arr) {
      const cutoff = Date.now() / 1000 - 24 * 3600;
      const trimmed = arr.filter(x => (x.ts || 0) >= cutoff).slice(-20000);
      localStorage.setItem(STORAGE_HIST, JSON.stringify(trimmed));
    }

    function extractResultObj(raw) {
      if (!raw) return { obj: null, err: "Пустой ответ UDP" };
      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        return { obj: null, err: "Не JSON: " + String(raw).slice(0, 80) };
      }
      if (parsed && parsed.error) {
        return { obj: null, err: "UDP ошибка: " + JSON.stringify(parsed.error).slice(0, 80) };
      }
      const candidate = parsed.result ?? parsed.data ?? parsed;
      if (candidate && typeof candidate === "object") {
        if (candidate.result && typeof candidate.result === "object") {
          return { obj: candidate.result, err: null };
        }
        return { obj: candidate, err: null };
      }
      return { obj: null, err: "Нет поля result в ответе" };
    }

    function udpRpc(method, id) {
      if (!window.VenusUdp || typeof window.VenusUdp.query !== "function") {
        return { data: null, err: "Мост VenusUdp не подключен в WebView" };
      }
      const payload = JSON.stringify({ id, method, params: { id: 0 } });
      const raw = window.VenusUdp.query(STATION_IP, PORT, payload, 1500);
      const res = extractResultObj(raw);
      return { data: res.obj, err: res.err };
    }

    function pollNow() {
      const rBat = udpRpc("Bat.GetStatus", 1);
      const rEs = udpRpc("ES.GetStatus", 2);
      const bat = rBat.data;
      const es = rEs.data;

      if (!bat && !es) {
        lastDiag = rBat.err || rEs.err || "Нет ответа от станции по UDP";
        render();
        return;
      }

      const socVal = bat && bat.soc !== undefined ? Number(bat.soc) : (es && es.bat_soc !== undefined ? Number(es.bat_soc) : NaN);
      const capVal = bat && bat.bat_capacity !== undefined ? Number(bat.bat_capacity) : (es && es.bat_capacity !== undefined ? Number(es.bat_capacity) : NaN);

      if (Number.isFinite(socVal) || Number.isFinite(capVal)) {
        const nowSec = Date.now() / 1000;
        const hist = loadHistory();
        const prev = hist.length ? hist[hist.length - 1] : null;
        const rated = Number((bat && bat.rated_capacity) || (es && es.rated_capacity) || (prev && prev.rated_capacity) || 2080) || 2080;
        const safeSoc = Number.isFinite(socVal) ? socVal : (prev ? Number(prev.soc) : 0);
        const safeCap = Number.isFinite(capVal) ? capVal : Math.round((safeSoc / 100) * rated);

        const pvW = Number((es && (es.pv_power ?? es.pvPower)) || 0);
        const ongridW = Number((es && (es.ongrid_power ?? es.grid_power ?? es.ongridPower)) || 0);
        const offgridW = Number((es && (es.offgrid_power ?? es.load_power ?? es.offgridPower)) || 0);
        const batPowerRaw = (bat && (bat.bat_power ?? bat.power ?? bat.charge_power));
        const momentW = Number.isFinite(Number(batPowerRaw)) ? Number(batPowerRaw) : (pvW + ongridW - offgridW);

        let chargedDeltaWh = 0;
        let dischargedDeltaWh = 0;
        if (prev && prev.ts && nowSec > prev.ts) {
          const dtH = Math.min((nowSec - prev.ts) / 3600.0, 0.25);
          const capDiff = safeCap - Number(prev.bat_capacity || safeCap);
          if (Math.abs(capDiff) > 0.1) {
            if (capDiff > 0) chargedDeltaWh = capDiff;
            else dischargedDeltaWh = Math.abs(capDiff);
          } else if (Math.abs(momentW) > 3.0) {
            const eWh = Math.abs(momentW) * dtH;
            if (momentW > 0) chargedDeltaWh = eWh;
            else dischargedDeltaWh = eWh;
          }
        }

        hist.push({
          ts: nowSec,
          soc: safeSoc,
          bat_capacity: safeCap,
          rated_capacity: rated,
          moment_w: momentW,
          charged_wh: chargedDeltaWh,
          discharged_wh: dischargedDeltaWh
        });
        saveHistory(hist);
        lastDiag = null;
      } else {
        const keys = bat ? Object.keys(bat).slice(0, 6).join(",") : (es ? Object.keys(es).slice(0, 6).join(",") : "пусто");
        lastDiag = "Неожиданные поля ответа: " + keys;
      }
      render();
    }

    function fmtDur(hours) {
      if (hours === null || !Number.isFinite(hours) || hours <= 0 || hours > 999) return "—";
      const totalMin = Math.round(hours * 60);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return `${h}ч ${m}м`;
    }

    function fmtClock(hours) {
      if (hours === null || !Number.isFinite(hours) || hours <= 0 || hours > 999) return "";
      const end = new Date(Date.now() + hours * 3600 * 1000);
      const hh = String(end.getHours()).padStart(2, "0");
      const mm = String(end.getMinutes()).padStart(2, "0");
      return `до ${hh}:${mm}`;
    }

    function buildDailySeries(hist) {
      const buckets = new Array(24).fill(null).map(() => ({ sumSoc: 0, cnt: 0, lastSoc: null }));
      const now = new Date();
      const startOfTodaySec = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;

      for (const p of hist) {
        if ((p.ts || 0) >= startOfTodaySec) {
          const d = new Date(p.ts * 1000);
          const h = d.getHours();
          buckets[h].sumSoc += Number(p.soc || 0);
          buckets[h].cnt += 1;
          buckets[h].lastSoc = Number(p.soc || 0);
        }
      }

      const points = [];
      let carry = null;
      for (let h = 0; h <= now.getHours(); h++) {
        if (buckets[h].cnt > 0) {
          carry = buckets[h].sumSoc / buckets[h].cnt;
          points.push({ hour: h, soc: carry });
        } else if (carry !== null) {
          points.push({ hour: h, soc: carry });
        }
      }
      return points;
    }

    function drawDailyChart(hist) {
      const c = document.getElementById("chart");
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, c.width, c.height);

      const pts = buildDailySeries(hist);
      if (!pts.length) return;

      const padL = 36, padR = 14, padT = 16, padB = 26;
      const w = c.width - padL - padR;
      const h = c.height - padT - padB;

      ctx.strokeStyle = "rgba(139,148,158,0.18)";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#8b949e";
      ctx.font = "11px system-ui, sans-serif";

      for (const pct of [0, 25, 50, 75, 100]) {
        const y = padT + h - (pct / 100) * h;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(padL + w, y);
        ctx.stroke();
        ctx.fillText(`${pct}%`, 4, y + 4);
      }

      for (const hr of [0, 6, 12, 18, 23]) {
        const x = padL + (hr / 23) * w;
        ctx.fillText(`${String(hr).padStart(2, "0")}:00`, Math.max(padL, Math.min(padL + w - 24, x - 12)), c.height - 6);
      }

      if (pts.length >= 2) {
        ctx.strokeStyle = "#2f81f7";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        pts.forEach((pt, idx) => {
          const x = padL + (pt.hour / 23) * w;
          const y = padT + h - (Math.max(0, Math.min(100, pt.soc)) / 100) * h;
          if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      const lastPt = pts[pts.length - 1];
      const lx = padL + (lastPt.hour / 23) * w;
      const ly = padT + h - (Math.max(0, Math.min(100, lastPt.soc)) / 100) * h;
      ctx.fillStyle = "#58a6ff";
      ctx.beginPath();
      ctx.arc(lx, ly, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function render() {
      const hist = loadHistory();
      if (!hist.length) {
        document.getElementById("updated").textContent = lastDiag || "Нет замеров";
        return;
      }

      const last = hist[hist.length - 1];
      const soc = Number(last.soc || 0);
      const capWh = Number(last.bat_capacity || 0);
      const ratedWh = Number(last.rated_capacity || 2080) || 2080;
      const momentW = Number(last.moment_w || 0);

      let status = "ОЖИДАНИЕ";
      if (momentW > 3.0) status = "ЗАРЯД";
      else if (momentW < -3.0) status = "РАЗРЯД";

      const reserveWh = ratedWh * (RESERVE_PCT / 100.0);
      const availWh = Math.max(0, capWh - reserveWh);
      const missingWh = Math.max(0, ratedWh - capWh);

      let etaMain = "—";
      let etaDetail = "Мощность близка к нулю";
      if (status === "ЗАРЯД" && momentW > 3.0) {
        const etaH = missingWh / (momentW * EFFICIENCY);
        etaMain = fmtDur(etaH);
        const clk = fmtClock(etaH);
        etaDetail = `До 100% при ${momentW.toFixed(0)} Вт${clk ? " • " + clk : ""}`;
      } else if (status === "РАЗРЯД" && momentW < -3.0) {
        const drawW = Math.abs(momentW);
        const etaH = availWh / drawW;
        etaMain = fmtDur(etaH);
        const clk = fmtClock(etaH);
        etaDetail = `До резерва ${RESERVE_PCT}% при ${drawW.toFixed(0)} Вт${clk ? " • " + clk : ""}`;
      }

      const now = new Date();
      const startOfTodaySec = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
      let chargedDayWh = 0;
      let dischargedDayWh = 0;
      for (const p of hist) {
        if ((p.ts || 0) >= startOfTodaySec) {
          chargedDayWh += Number(p.charged_wh || 0);
          dischargedDayWh += Number(p.discharged_wh || 0);
        }
      }

      const dt = new Date(last.ts * 1000);
      document.getElementById("updated").textContent = `Обновлено: ${dt.toLocaleTimeString()} • авто 5с`;
      document.getElementById("soc").textContent = `${soc}%`;
      document.getElementById("cap").textContent = `${Math.round(capWh)} / ${Math.round(ratedWh)} Вт·ч`;
      document.getElementById("moment").textContent = `${momentW.toFixed(0)} Вт`;
      document.getElementById("eta").textContent = etaMain;
      document.getElementById("etaSub").textContent = etaDetail;
      document.getElementById("dayCharged").textContent = `Заряжено за сутки: ${Math.round(chargedDayWh)} Вт·ч`;
      document.getElementById("dayDischarged").textContent = `Высажено за сутки: ${Math.round(dischargedDayWh)} Вт·ч`;

      const badge = document.getElementById("statusBadge");
      badge.textContent = status;
      badge.className = "badge" + (status === "ЗАРЯД" ? " charge" : status === "РАЗРЯД" ? " discharge" : "");

      drawDailyChart(hist);
    }

    pollNow();
    setInterval(pollNow, POLL_MS);
  </script>
</body>
</html>
